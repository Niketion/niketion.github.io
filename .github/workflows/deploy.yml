name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Validate production artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          test -d dist/assets
          find dist/assets -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -type f -name '*.css' -print -quit | grep -q .

          if grep -R -E '(/src/|\.tsx)' dist/index.html; then
            echo "Errore: dist/index.html contiene ancora riferimenti ai sorgenti TypeScript/TSX."
            exit 1
          fi

          echo "Artefatto valido: verranno pubblicati esclusivamente i file compilati in dist/."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
